services:
  postgres:
    image: postgres:16-alpine
    container_name: miriv-postgres
    environment:
      POSTGRES_DB: miriv
      POSTGRES_USER: miriv
      POSTGRES_PASSWORD: miriv
    ports:
      - "5432:5432"
    volumes:
      - miriv-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miriv -d miriv"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  miriv-postgres-data:
