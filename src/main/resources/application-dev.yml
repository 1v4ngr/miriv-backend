logging:
  level:
    coop.miriv.enology: DEBUG
    org.hibernate.SQL: DEBUG

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/miriv}
    username: ${DB_USERNAME:miriv}
    password: ${DB_PASSWORD:miriv}
  jpa:
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:db/migration,classpath:db/dev-seed

app:
  security:
    jwt:
      # Same access-token-minutes as the base config (F1B-08): override with APP_JWT_MINUTES
      # if a longer-lived dev token is ever needed, instead of hardcoding a second value here.
      secret: ${JWT_SECRET:change-this-development-secret-must-be-at-least-32-bytes-long}
