spring:
  application:
    name: enology-tracking-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring.ai.mcp.server:
  name: miriv
  version: 1.0.0
  protocol: STATELESS
  type: SYNC
  streamable-http:
    mcp-endpoint: /mcp

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-minutes: ${APP_JWT_MINUTES:30}
      issuer: miriv-enology-tracking
    # Account that always holds SUPER_ADMIN (added on startup if missing). Empty disables it.
    super-admin-email: ${APP_SUPER_ADMIN_EMAIL:ivangoru22@gmail.com}
  timezone: ${APP_TIMEZONE:Europe/Madrid}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /docs
